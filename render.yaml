services:
  # Unified Web Service (React Frontend + FastAPI Backend)
  - type: web
    name: smartfin-ai
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartfin-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: smartfin-postgres
    databaseName: smartfin
    user: smartfin_admin
    plan: free
    region: oregon
