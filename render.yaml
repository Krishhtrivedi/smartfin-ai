services:
  # Backend API (Python FastAPI + PostgreSQL)
  - type: web
    name: smartfin-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartfin-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false

  # Frontend Web UI (React Vite SPA)
  - type: web
    name: smartfin-ai-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: smartfin-db
    databaseName: smartfin
    user: smartfin_user
    plan: free
    region: oregon
